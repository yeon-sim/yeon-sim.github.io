<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>폰트 테스트 — 연심</title>
<style>
  /* static/font 의 모든 폰트를 등록 */
  @font-face { font-family: 'BebasKai';                 src: url('/font/BebasKai.woff2') format('woff2'); }
  @font-face { font-family: 'Cafe24Shiningstar';        src: url('/font/Cafe24Shiningstar.woff2') format('woff2'); }
  @font-face { font-family: 'Caveat-SemiBold';          src: url('/font/Caveat-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Corporate-Logo-Bold-ver2'; src: url('/font/Corporate-Logo-Bold-ver2.woff2') format('woff2'); }
  @font-face { font-family: 'ExcelsiorSans';            src: url('/font/ExcelsiorSans.woff2') format('woff2'); }
  @font-face { font-family: 'HigashiOme-Gothic-C-1.3';  src: url('/font/HigashiOme-Gothic-C-1.3.woff2') format('woff2'); }
  @font-face { font-family: 'KOTRA_BOLD';               src: url('/font/KOTRA_BOLD.woff2') format('woff2'); }
  @font-face { font-family: 'LiberationSans';           src: url('/font/LiberationSans.woff2') format('woff2'); }
  @font-face { font-family: 'Mary_Jane_Antique';        src: url('/font/Mary_Jane_Antique.woff2') format('woff2'); }
  @font-face { font-family: 'Mikodacs';                 src: url('/font/Mikodacs.woff2') format('woff2'); }
  @font-face { font-family: 'PerfectDOSVGA437';         src: url('/font/PerfectDOSVGA437.woff2') format('woff2'); }
  @font-face { font-family: 'SCDream5';                 src: url('/font/SCDream5.woff2') format('woff2'); }
  @font-face { font-family: 'katyoubb';                 src: url('/font/katyoubb.woff2') format('woff2'); }
  @font-face { font-family: 'wthc06';                   src: url('/font/wthc06.woff2') format('woff2'); }
  @font-face { font-family: 'languagefont';             src: url('/font/languagefont.ttf') format('truetype'); }
  @font-face { font-family: 'logotypejp_mp_b_1.1';      src: url('/font/logotypejp_mp_b_1.1.woff2') format('woff2'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #120d08;                 /* 실제 앱과 동일한 어두운 배경 */
    color: #e6e0d6;
    font-family: 'Malgun Gothic', system-ui, sans-serif;
    padding: 24px;
    line-height: 1.4;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .note { color: #9a8f7d; font-size: 13px; margin-bottom: 16px; }
  .note b { color: #c9a84c; }
  .controls {
    position: sticky; top: 0; z-index: 2;
    background: #120d08; padding: 12px 0; margin-bottom: 8px;
    border-bottom: 1px solid #3a2f1f;
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: #c9a84c; }
  .samples { font-size: 13px; color: #9a8f7d; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #3a2f1f; padding: 10px 14px; text-align: left; vertical-align: middle; }
  th { background: #1c150d; color: #c9a84c; font-size: 13px; position: sticky; top: 57px; z-index: 1; }
  td.fname { font-size: 13px; color: #b8ab95; white-space: nowrap; font-family: 'Consolas', monospace; }
  .sample { color: #f0e9dc; white-space: nowrap; }
  /* 각 셀은 해당 폰트만 지정(폴백 없음) → 커버리지 공백이 그대로 드러남 */
  .f-BebasKai                 { font-family: 'BebasKai'; }
  .f-Cafe24Shiningstar        { font-family: 'Cafe24Shiningstar'; }
  .f-Caveat-SemiBold          { font-family: 'Caveat-SemiBold'; }
  .f-Corporate-Logo-Bold-ver2 { font-family: 'Corporate-Logo-Bold-ver2'; }
  .f-ExcelsiorSans            { font-family: 'ExcelsiorSans'; }
  .f-HigashiOme-Gothic-C-1\.3 { font-family: 'HigashiOme-Gothic-C-1.3'; }
  .f-KOTRA_BOLD               { font-family: 'KOTRA_BOLD'; }
  .f-LiberationSans           { font-family: 'LiberationSans'; }
  .f-Mary_Jane_Antique        { font-family: 'Mary_Jane_Antique'; }
  .f-Mikodacs                 { font-family: 'Mikodacs'; }
  .f-PerfectDOSVGA437         { font-family: 'PerfectDOSVGA437'; }
  .f-SCDream5                 { font-family: 'SCDream5'; }
  .f-katyoubb                 { font-family: 'katyoubb'; }
  .f-wthc06                   { font-family: 'wthc06'; }
  .f-languagefont             { font-family: 'languagefont'; }
  .f-logotypejp_mp_b_1\.1     { font-family: 'logotypejp_mp_b_1.1'; }
</style>
</head>
<body>
  <h1>폰트 테스트 — 테마팩 1003</h1>
  <p class="note">
    각 셀은 해당 폰트<b>만</b> 지정(폴백 없음)했습니다. 글자가 <b>안 보이거나(빈 글리프) 어색한 다른 폰트로 보이면</b> 그 언어를 커버하지 못하는 것입니다.
    샘플: 한글 <b>카지노 푸어</b> · English <b>Flat-broke Gamblers</b> · 日本語 <b>カジノプアー</b>
  </p>

  <div class="controls">
    <label>크기 <input type="range" id="size" min="16" max="72" value="32"> <span id="sizeVal">32</span>px</label>
    <label><input type="checkbox" id="grid" checked> 셀 배경(공백 식별용)</label>
  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th>폰트</th>
        <th>한글 · 카지노 푸어</th>
        <th>English · Flat-broke Gamblers</th>
        <th>日本語 · カジノプアー</th>
      </tr>
    </thead>
    <tbody><!-- rows injected --></tbody>
  </table>

  <script>
    const FONTS = [
      'BebasKai','Cafe24Shiningstar','Caveat-SemiBold','Corporate-Logo-Bold-ver2',
      'ExcelsiorSans','HigashiOme-Gothic-C-1.3','KOTRA_BOLD','LiberationSans',
      'Mary_Jane_Antique','Mikodacs','PerfectDOSVGA437','SCDream5','katyoubb','wthc06',
      'languagefont','logotypejp_mp_b_1.1'
    ];
    const KR = '카지노 푸어', EN = 'Flat-broke Gamblers', JP = 'カジノプアー';
    const tbody = document.querySelector('#tbl tbody');
    for (const f of FONTS) {
      const tr = document.createElement('tr');
      const fc = 'f-' + f;   // 실제 className (점 이스케이프 불필요)
      tr.innerHTML =
        `<td class="fname">${f}</td>` +
        `<td><span class="sample ${fc}">${KR}</span></td>` +
        `<td><span class="sample ${fc}">${EN}</span></td>` +
        `<td><span class="sample ${fc}">${JP}</span></td>`;
      tbody.appendChild(tr);
    }
    const size = document.getElementById('size'), sizeVal = document.getElementById('sizeVal');
    const apply = () => {
      sizeVal.textContent = size.value;
      document.querySelectorAll('.sample').forEach(el => el.style.fontSize = size.value + 'px');
    };
    size.addEventListener('input', apply); apply();
    document.getElementById('grid').addEventListener('change', e => {
      document.querySelectorAll('.sample').forEach(el =>
        el.style.background = e.target.checked ? 'rgba(201,168,76,0.10)' : '');
    });
    document.getElementById('grid').dispatchEvent(new Event('change'));
  </script>
</body>
</html>
